<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL Intelligence — Team #5163684</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #080b10;
    --surface: #0e1218;
    --surface2: #141920;
    --border: #1e2530;
    --border2: #252d3a;
    --green: #00e676;
    --green-dim: #00c853;
    --amber: #ffd740;
    --red: #ff5252;
    --blue: #40c4ff;
    --purple: #b388ff;
    --text: #e8ecf0;
    --text-dim: #8899aa;
    --text-muted: #445566;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px 20px 48px;
    max-width: 960px;
  }

  .header {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 0.04em;
    color: var(--green);
    line-height: 1;
  }

  .header-sub {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-bottom: 6px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .gw-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .gw-input {
    width: 60px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .gw-input:focus { border-color: var(--green); }

  .load-btn {
    background: var(--green);
    border: none;
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.08em;
    padding: 9px 24px;
    cursor: pointer;
    transition: background 0.2s;
    flex: 1;
    max-width: 280px;
  }
  .load-btn:hover { background: var(--green-dim); }
  .load-btn:disabled { background: var(--border2); color: var(--text-muted); cursor: not-allowed; }

  #status {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    margin-bottom: 20px;
    min-height: 14px;
  }
  #status.ok { color: var(--green); }
  #status.err { color: var(--red); }

  .manager-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 1px;
    background: var(--border);
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }

  .manager-stat {
    background: var(--surface);
    padding: 10px 12px;
  }

  .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
  }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--green);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .section-header {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin: 20px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .squad-table { width: 100%; border-collapse: collapse; }

  .squad-table th {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 5px 7px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .squad-table th.r { text-align: right; }

  .squad-table td {
    padding: 6px 7px;
    border-bottom: 1px solid var(--surface2);
    vertical-align: middle;
  }
  .squad-table tr:hover td { background: var(--surface2); }
  .bench-row td { opacity: 0.45; }

  .pos-badge {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    padding: 1px 4px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .pos-1 { background: #071408; color: var(--green); border: 1px solid #1a4020; }
  .pos-2 { background: #070f18; color: var(--blue); border: 1px solid #1a3050; }
  .pos-3 { background: #110718; color: var(--purple); border: 1px solid #301545; }
  .pos-4 { background: #180707; color: #ff8a80; border: 1px solid #401515; }

  .cap-badge {
    display: inline-block;
    background: var(--green);
    color: #000;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    padding: 1px 4px;
    margin-left: 3px;
    vertical-align: middle;
  }
  .vc-badge {
    display: inline-block;
    background: transparent;
    color: var(--green);
    border: 1px solid var(--green);
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    padding: 1px 4px;
    margin-left: 3px;
    vertical-align: middle;
  }

  .mono { font-family: 'Space Mono', monospace; font-size: 10px; }
  .r { text-align: right; }
  .green { color: var(--green); }
  .amber { color: var(--amber); }
  .red { color: var(--red); }
  .dim { color: var(--text-dim); }
  .muted { color: var(--text-muted); }

  .fix-strip { display: flex; gap: 3px; flex-wrap: wrap; }
  .fix-pill {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    padding: 2px 4px;
    white-space: nowrap;
  }
  .fdr-1, .fdr-2 { background: #071408; color: #69f0ae; border: 1px solid #1a4020; }
  .fdr-3 { background: #141000; color: var(--amber); border: 1px solid #3a2c00; }
  .fdr-4, .fdr-5 { background: #180707; color: #ff8a80; border: 1px solid #401515; }
  .fix-dgw { background: #002010; color: var(--green); border: 1px solid #005a25; font-weight: 700; }
  .fix-blank { background: #101010; color: var(--text-muted); border: 1px solid var(--border); }

  .price-tag {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    padding: 1px 3px;
    margin-left: 3px;
    vertical-align: middle;
  }
  .price-up { color: var(--green); border: 1px solid #1a4020; background: #071408; }
  .price-down { color: var(--red); border: 1px solid #401515; background: #180707; }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.1em;
    padding: 11px 20px;
    cursor: pointer;
    width: 100%;
    margin-top: 16px;
    transition: all 0.2s;
  }
  .copy-btn:hover { background: #071408; }
  .copy-btn.copied { background: var(--green); color: #000; }

  .copy-preview {
    background: #040608;
    border: 1px solid var(--border);
    border-top: none;
    padding: 14px;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    line-height: 1.7;
    white-space: pre-wrap;
    display: none;
    word-break: break-word;
    max-height: 260px;
    overflow-y: auto;
  }

  hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 10px;
  }
  .search-input:focus { border-color: var(--green); }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:disabled { opacity: 0.3; }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    align-items: start;
    margin-bottom: 5px;
    animation: fadeUp 0.1s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-name { font-weight: 500; }
  .result-meta {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .result-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--green);
    text-align: right;
    line-height: 1;
  }
  .result-form {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-align: right;
    margin-top: 4px;
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 28px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">FPL INTEL</div>
  </div>
  <div class="header-sub">Team #5163684 · Live intelligence · 2025/26</div>
</div>

<div class="controls">
  <span class="gw-label">GW</span>
  <input type="number" class="gw-input" id="gwInput" value="34" min="1" max="38" />
  <button class="load-btn" id="loadBtn" onclick="loadAll()">⚡ Load Intelligence</button>
</div>

<div id="status">Set gameweek and press Load.</div>

<div id="mainContent" style="display:none">

  <div class="manager-bar" id="managerBar"></div>

  <div class="section-header">Starting XI</div>
  <table class="squad-table">
    <thead><tr>
      <th>Player</th>
      <th class="r">£</th>
      <th class="r">Form</th>
      <th class="r">PPG</th>
      <th class="r">Pts</th>
      <th class="r">Mins</th>
      <th class="r">ICT</th>
      <th class="r">Own%</th>
      <th class="r">Status</th>
      <th>GW35–38 Fixtures</th>
    </tr></thead>
    <tbody id="startingBody"></tbody>
  </table>

  <div class="section-header">Bench</div>
  <table class="squad-table">
    <thead><tr>
      <th>Player</th>
      <th class="r">£</th>
      <th class="r">Form</th>
      <th class="r">PPG</th>
      <th class="r">Pts</th>
      <th class="r">Mins</th>
      <th class="r">ICT</th>
      <th class="r">Own%</th>
      <th class="r">Status</th>
      <th>GW35–38 Fixtures</th>
    </tr></thead>
    <tbody id="benchBody"></tbody>
  </table>

  <button class="copy-btn" id="copyBtn" onclick="copyForClaude()">📋 Copy for Claude</button>
  <div class="copy-preview" id="copyPreview"></div>

</div>

<hr />

<div class="section-header" style="margin-top:0">Search Any Player</div>
<input type="text" class="search-input" id="searchInput"
  placeholder="Search any player — shows form, ICT, fixtures, ownership..."
  oninput="doSearch()" disabled />
<div id="searchResults"><div class="empty">LOAD DATA FIRST</div></div>

<script>
const TEAM_ID = 5163684;
const PROXY = 'https://corsproxy.io/?';
const POS = {1:'GK',2:'DEF',3:'MID',4:'FWD'};

let allPlayers = [], playerMap = {}, teamMap = {}, fixtureMap = {};
let squadSnapshot = {}, managerData = {};

async function fetchJSON(url) {
  const res = await fetch(PROXY + encodeURIComponent(url));
  if (!res.ok) throw new Error(url.split('/').pop() + ' API failed (' + res.status + ')');
  return res.json();
}

async function loadAll() {
  const btn = document.getElementById('loadBtn');
  const status = document.getElementById('status');
  const gw = parseInt(document.getElementById('gwInput').value);
  if (!gw || gw < 1 || gw > 38) { status.className='err'; status.textContent='✗ Invalid gameweek (1–38).'; return; }

  btn.disabled = true; btn.textContent = 'Loading...';
  status.className = ''; status.textContent = 'Fetching squad, player data and fixtures...';

  try {
    const [bootstrap, picks, fixtures, history] = await Promise.all([
      fetchJSON('https://fantasy.premierleague.com/api/bootstrap-static/'),
      fetchJSON('https://fantasy.premierleague.com/api/entry/' + TEAM_ID + '/event/' + gw + '/picks/'),
      fetchJSON('https://fantasy.premierleague.com/api/fixtures/'),
      fetchJSON('https://fantasy.premierleague.com/api/entry/' + TEAM_ID + '/history/')
    ]);

    // Teams
    teamMap = {};
    bootstrap.teams.forEach(t => { teamMap[t.id] = t.short_name; });

    // Fixture map per team GW35-38
    fixtureMap = {};
    const gwRange = [35,36,37,38];
    fixtures.forEach(f => {
      if (!gwRange.includes(f.event)) return;
      const add = (tid, oid, home) => {
        if (!fixtureMap[tid]) fixtureMap[tid] = [];
        fixtureMap[tid].push({ gw: f.event, opp: teamMap[oid]||'?', fdr: home ? f.team_h_difficulty : f.team_a_difficulty, home });
      };
      add(f.team_h, f.team_a, true);
      add(f.team_a, f.team_h, false);
    });
    // Mark DGWs
    Object.keys(fixtureMap).forEach(tid => {
      const counts = {};
      fixtureMap[tid].forEach(f => { counts[f.gw] = (counts[f.gw]||0)+1; });
      fixtureMap[tid].forEach(f => { f.isDGW = counts[f.gw] > 1; });
    });

    // Players
    allPlayers = []; playerMap = {};
    bootstrap.elements.forEach(p => {
      const obj = {
        id: p.id, name: p.web_name,
        fullName: p.first_name + ' ' + p.second_name,
        team: teamMap[p.team]||'?', teamId: p.team,
        position: p.element_type,
        price: p.now_cost / 10,
        form: parseFloat(p.form)||0,
        ppg: parseFloat(p.points_per_game)||0,
        totalPts: p.total_points,
        minutes: p.minutes,
        ict: parseFloat(p.ict_index)||0,
        owned: p.selected_by_percent,
        status: p.status,
        chanceNext: p.chance_of_playing_next_round,
        news: p.news||'',
        tIn: p.transfers_in_event,
        tOut: p.transfers_out_event,
        priceChange: p.cost_change_event
      };
      allPlayers.push(obj); playerMap[p.id] = obj;
    });

    // Manager history
    const gwHist = history.current.find(h => h.event === gw) || {};
    const lastHist = history.current[history.current.length-1] || {};
    managerData = {
      gw,
      gwPoints: gwHist.points || 0,
      gwRank: gwHist.rank ? Number(gwHist.rank).toLocaleString() : '—',
      totalPoints: lastHist.total_points || 0,
      overallRank: lastHist.overall_rank ? Number(lastHist.overall_rank).toLocaleString() : '—',
      bank: (picks.entry_history?.bank||0)/10,
      squadValue: picks.picks.reduce((s,p)=>s+(playerMap[p.element]?.price||0),0)
    };

    // Squad
    const starting = picks.picks.filter(p=>p.position<=11).sort((a,b)=>a.position-b.position);
    const bench = picks.picks.filter(p=>p.position>11).sort((a,b)=>a.position-b.position);
    squadSnapshot = { gw, starting, bench };

    renderManagerBar();
    renderRows('startingBody', starting, false);
    renderRows('benchBody', bench, true);

    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('searchInput').disabled = false;
    document.getElementById('searchResults').innerHTML = '<div class="empty">TYPE TO SEARCH ALL PLAYERS</div>';
    status.className = 'ok';
    status.textContent = '✓ GW' + gw + ' loaded · ' + allPlayers.length + ' players · fixture data GW35–38';
    btn.textContent = '↺ Reload'; btn.disabled = false;

  } catch(e) {
    status.className = 'err'; status.textContent = '✗ ' + e.message;
    btn.textContent = '⚡ Retry'; btn.disabled = false;
  }
}

function renderManagerBar() {
  const d = managerData;
  document.getElementById('managerBar').innerHTML = [
    ['GW'+d.gw+' Pts', d.gwPoints],
    ['GW Rank', d.gwRank],
    ['Total Pts', d.totalPoints],
    ['Overall Rank', d.overallRank],
    ['Squad £', '£'+d.squadValue.toFixed(1)+'m'],
    ['Bank', '£'+d.bank.toFixed(1)+'m'],
    ['Budget', '£'+(d.squadValue+d.bank).toFixed(1)+'m']
  ].map(([l,v]) => `<div class="manager-stat"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`).join('');
}

function fClass(f) { return f>=6?'green':f>=3?'amber':'red'; }

function statusCell(p) {
  if (p.status==='a') {
    if (p.chanceNext===75) return '<span class="mono amber">75%</span>';
    if (p.chanceNext===50) return '<span class="mono amber">50%</span>';
    if (p.chanceNext===25) return '<span class="mono red">25%</span>';
    return '<span class="mono muted">✓</span>';
  }
  const map = {d:'<span class="mono amber">⚠Doubt</span>',i:'<span class="mono red">✗Inj</span>',s:'<span class="mono red">✗Sus</span>',u:'<span class="mono red">✗N/A</span>'};
  return map[p.status]||'<span class="mono muted">—</span>';
}

function fixHtml(teamId) {
  const gws = [35,36,37,38];
  const fixes = fixtureMap[teamId]||[];
  return '<div class="fix-strip">' + gws.map(gw => {
    const m = fixes.filter(f=>f.gw===gw);
    if (!m.length) return '<span class="fix-pill fix-blank">—</span>';
    return m.map(f => `<span class="fix-pill ${f.isDGW?'fix-dgw':'fdr-'+f.fdr}">${f.opp}${f.isDGW?'×2':''}</span>`).join('');
  }).join('') + '</div>';
}

function renderRows(tbodyId, picks, isBench) {
  document.getElementById(tbodyId).innerHTML = picks.map(pick => {
    const p = playerMap[pick.element]; if (!p) return '';
    const pc = p.priceChange!==0 ? `<span class="price-tag ${p.priceChange>0?'price-up':'price-down'}">${p.priceChange>0?'▲':'▼'}</span>` : '';
    return `<tr class="${isBench?'bench-row':''}">
      <td><span class="pos-badge pos-${p.position}">${POS[p.position]}</span><span style="font-weight:500">${p.name}</span>${pick.is_captain?'<span class="cap-badge">C</span>':''}${pick.is_vice_captain?'<span class="vc-badge">VC</span>':''}${pc}</td>
      <td class="mono green r">£${p.price.toFixed(1)}</td>
      <td class="mono r ${fClass(p.form)}">${p.form.toFixed(1)}</td>
      <td class="mono dim r">${p.ppg.toFixed(1)}</td>
      <td class="mono dim r">${p.totalPts}</td>
      <td class="mono dim r">${p.minutes}</td>
      <td class="mono dim r">${p.ict.toFixed(0)}</td>
      <td class="mono dim r">${p.owned}%</td>
      <td>${statusCell(p)}</td>
      <td>${fixHtml(p.teamId)}</td>
    </tr>`;
  }).join('');
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const container = document.getElementById('searchResults');
  if (q.length < 2) { container.innerHTML = '<div class="empty">TYPE AT LEAST 2 CHARACTERS</div>'; return; }
  const matches = allPlayers.filter(p => p.name.toLowerCase().includes(q)||p.fullName.toLowerCase().includes(q)).slice(0,8);
  if (!matches.length) { container.innerHTML = '<div class="empty">NO PLAYERS FOUND</div>'; return; }
  container.innerHTML = matches.map(p => {
    const tActivity = (p.tIn||p.tOut) ? `↑${((p.tIn||0)/1000).toFixed(0)}k ↓${((p.tOut||0)/1000).toFixed(0)}k` : '';
    const statusStr = p.status!=='a' ? ` <span class="mono ${p.status==='d'?'amber':'red'}">[${p.status.toUpperCase()}]</span>` : '';
    return `<div class="result-card">
      <div>
        <div class="result-name"><span class="pos-badge pos-${p.position}">${POS[p.position]}</span>${p.name}${statusStr}</div>
        <div class="result-meta">
          <span>${p.fullName} · ${p.team}</span>
          <span class="${fClass(p.form)}">Form ${p.form}</span>
          <span>PPG ${p.ppg}</span>
          <span>Pts ${p.totalPts}</span>
          <span>Mins ${p.minutes}</span>
          <span>ICT ${p.ict.toFixed(0)}</span>
          <span>Own ${p.owned}%</span>
          ${tActivity?`<span class="amber">${tActivity}</span>`:''}
          ${p.news?`<span style="color:var(--amber);font-size:9px">${p.news.slice(0,60)}</span>`:''}
        </div>
        <div style="margin-top:5px">${fixHtml(p.teamId)}</div>
      </div>
      <div>
        <div class="result-price">£${p.price.toFixed(1)}m</div>
        <div class="result-form ${fClass(p.form)}">Form ${p.form}</div>
      </div>
    </div>`;
  }).join('');
}

function copyForClaude() {
  const { gw, starting, bench } = squadSnapshot;
  if (!starting?.length) return;

  const fmtPick = pick => {
    const p = playerMap[pick.element]; if (!p) return '';
    const fixes = (fixtureMap[p.teamId]||[]).map(f=>`GW${f.gw}:${f.opp}(FDR${f.fdr}${f.isDGW?'×2':''})`).join(',');
    const cap = pick.is_captain?' [C]':pick.is_vice_captain?' [VC]':'';
    const st = p.status!=='a'?` [${p.status.toUpperCase()}]${p.news?' NOTE:'+p.news.slice(0,80):''}` : '';
    return `${p.name}(${p.team}) £${p.price.toFixed(1)}m Form:${p.form} PPG:${p.ppg} Pts:${p.totalPts} Mins:${p.minutes} ICT:${p.ict.toFixed(0)} Own:${p.owned}% Fixes[${fixes||'none'}]${cap}${st}`;
  };

  const byPos = pos => starting.filter(pk=>playerMap[pk.element]?.position===pos).map(fmtPick).join('\n     ');

  // Market — top 35 per position by form, min 200 mins
  const market = [1,2,3,4].map(pos => {
    const players = allPlayers
      .filter(p=>p.position===pos && p.minutes>=200)
      .sort((a,b)=>b.form-a.form)
      .slice(0,35)
      .map(p => {
        const fixes = (fixtureMap[p.teamId]||[]).map(f=>`GW${f.gw}:${f.opp}(${f.fdr}${f.isDGW?'×2':''})`).join(',');
        return `${p.name}(${p.team})£${p.price.toFixed(1)} F${p.form} PPG${p.ppg} Pts${p.totalPts} ICT${p.ict.toFixed(0)} Own${p.owned}% [${fixes}]${p.status!=='a'?'['+p.status.toUpperCase()+']':''}`;
      }).join(' || ');
    return POS[pos] + ':\n' + players;
  }).join('\n\n');

  // Transfer movers
  const topIn = [...allPlayers].filter(p=>p.tIn>0).sort((a,b)=>b.tIn-a.tIn).slice(0,10)
    .map(p=>`${p.name}(${p.team})+${(p.tIn/1000).toFixed(0)}k`).join(', ');
  const topOut = [...allPlayers].filter(p=>p.tOut>0).sort((a,b)=>b.tOut-a.tOut).slice(0,10)
    .map(p=>`${p.name}(${p.team})-${(p.tOut/1000).toFixed(0)}k`).join(', ');

  const d = managerData;
  const text = [
    '=== FPL INTELLIGENCE — GW'+gw+' (Team #5163684) ===',
    'GW Pts: '+d.gwPoints+' | GW Rank: '+d.gwRank+' | Season Pts: '+d.totalPoints+' | Overall Rank: '+d.overallRank,
    'Squad: £'+d.squadValue.toFixed(1)+'m | Bank: £'+d.bank.toFixed(1)+'m | Budget: £'+(d.squadValue+d.bank).toFixed(1)+'m',
    '',
    '--- SQUAD (Name(Club) £Price Form PPG TotalPts Mins ICT Own% Fixtures) ---',
    'GK:  '+byPos(1),
    'DEF: '+byPos(2),
    'MID: '+byPos(3),
    'FWD: '+byPos(4),
    '',
    'BENCH: '+bench.map(fmtPick).join('\n       '),
    '',
    '[C]=Captain [VC]=VC | Status: a=fit d=doubt i=injured s=suspended',
    'Fixture FDR: 1-2=easy 3=medium 4-5=hard | ×2 = Double Gameweek',
    '',
    '--- TRANSFER MARKET (top 35 per position by form, 200+ mins) ---',
    market,
    '',
    '--- TRANSFER ACTIVITY THIS GW ---',
    'Most bought: '+topIn,
    'Most sold:   '+topOut
  ].join('\n');

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    const preview = document.getElementById('copyPreview');
    btn.textContent = '✓ Copied to clipboard';
    btn.classList.add('copied');
    preview.textContent = text;
    preview.style.display = 'block';
    setTimeout(()=>{ btn.textContent='📋 Copy for Claude'; btn.classList.remove('copied'); }, 2500);
  }).catch(()=>{
    const preview = document.getElementById('copyPreview');
    preview.textContent = text;
    preview.style.display = 'block';
    document.getElementById('copyBtn').textContent = '👆 Select text below and copy manually';
  });
}
</script>
</body>
</html>
